<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Build results, source checks, axiom audits, and timings for MatingOfTrees.">
<title>MatingOfTrees · Build reports</title>
<style>
:root{color-scheme:light;--ink:#172f31;--muted:#526665;--line:#d9e2de;--paper:#f4f6f1;--green:#17644b;--red:#a52f36;--amber:#8b5c13}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:var(--green);text-underline-offset:4px}a:hover{color:var(--ink)}button{font:inherit}main{max-width:1120px;margin:auto;padding:38px 28px 70px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:44px}.brand{font-weight:750;letter-spacing:-.5px}.tag{font:12px/1.4 ui-monospace,monospace;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}h1{font-size:clamp(30px,5vw,52px);font-weight:650;letter-spacing:-1.8px;line-height:1.15;margin:15px 0}h2{font-size:21px;letter-spacing:-.4px;margin:0 0 16px}h3{font-size:17px;margin:0 0 8px}p{margin:10px 0 18px}.muted{color:var(--muted)}.badge{display:inline-block;border:1px solid currentColor;border-radius:30px;padding:4px 12px;font-size:13px;font-weight:650}.success,.passed{color:var(--green)}.failure,.failed{color:var(--red)}.error,.superseded,.not_recorded{color:var(--amber)}.hero{margin-bottom:34px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere;font-size:13px}.facts{display:flex;flex-wrap:wrap;gap:12px 30px;margin:24px 0}.facts strong{display:block}.facts span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:30px 0}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}.card p{font-size:14px;margin-bottom:0}.card .badge{margin-bottom:16px}.columns{display:grid;grid-template-columns:1.1fr 1fr;gap:20px}.panel{margin-bottom:20px}table{width:100%;border-collapse:collapse;text-align:left;font-size:14px}td,th{padding:11px 0;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td:last-child,th:last-child{text-align:right}tr:last-child td{border-bottom:0}.timing{display:grid;grid-template-columns:145px 1fr 72px;gap:12px;align-items:center;font-size:13px;margin:14px 0}.track{height:7px;background:#edf0eb;border-radius:5px}.bar{height:7px;background:#5a8f7b;border-radius:5px}.timing span:last-child{text-align:right;font-variant-numeric:tabular-nums}details{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}summary{cursor:pointer;font-weight:600}li{margin:8px 0}footer{border-top:1px solid var(--line);margin-top:30px;padding-top:22px;font-size:13px;color:var(--muted)}.loading{padding:35px 0}.recent td{vertical-align:top}.recent a{font-family:ui-monospace,monospace}.notice{border-left:3px solid var(--amber);padding:10px 16px;background:#fffbef}.linkrow{display:flex;gap:20px;flex-wrap:wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:740px){main{padding:24px 18px 45px}header{margin-bottom:28px}.grid,.columns{grid-template-columns:1fr}.grid{gap:10px}.card,.panel{padding:20px}.timing{grid-template-columns:115px 1fr 64px;gap:8px}.recent th:nth-child(3),.recent td:nth-child(3){display:none}}
</style>
</head>
<body>
<main>
<header><a class="brand" href="./">MatingOfTrees</a><span class="tag">Build reports</span></header>
<div id="content" aria-live="polite"><p class="loading">Loading the build report…</p></div>
<noscript>This viewer needs JavaScript to load the public report data. The data is also available in the linked reports repository.</noscript>
<footer>Public build summaries only. Project source, raw compiler logs, credentials, and cluster details are not published here. <a href="https://github.com/rodrigo-castellon/lean-ci-reports">Report repository</a>.</footer>
</main>
<script>
'use strict';
const DATA='https://raw.githubusercontent.com/rodrigo-castellon/lean-ci-reports/';
const SOURCE='https://github.com/leobon12/lean-research/commit/';
const root=document.getElementById('content');
const shaPattern=/^[0-9a-f]{40}$/;
const labels={success:'Passed',failure:'Failed',error:'Infrastructure error',superseded:'Not built',passed:'Passed',failed:'Failed',not_recorded:'Not recorded'};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=x=>`<span class="badge ${Object.hasOwn(labels,x)?x:'not_recorded'}">${esc(labels[x]||'Unknown')}</span>`;
const duration=x=>typeof x==='number'?`${x.toFixed(1)} s`:'Not recorded';
const date=x=>typeof x==='number'?new Date(x*1000).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}):'Not recorded';
const row=(a,b)=>`<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`;
async function load(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(`Report data is not available yet (HTTP ${r.status}). Please retry shortly.`);return r.json();}
function render(r,jsonUrl){
 if(r.schema!==1||!shaPattern.test(r.sha)||!['success','failure','error','superseded'].includes(r.status))throw new Error('This report has an unsupported format.');
 document.title=`${labels[r.status]} · ${r.sha.slice(0,10)} · MatingOfTrees`;
 const c=r.checks||{},t=r.timings_seconds||{},s=r.source_counts||{},a=r.axioms;
 const titles={success:'The build passed.',failure:'A required check failed.',error:'The run could not complete.',superseded:'This revision was not built.'};
 const intro={success:'The checks recorded below completed successfully for this exact commit.',failure:'At least one required check failed. The recorded stages show how far the run got.',error:'An infrastructure issue prevented a complete result. This does not establish that the Lean source is incorrect.',superseded:'This queued PR revision was superseded or closed before it ran. It has no compilation verdict.'};
 const cards=[['source','Source checks','Checks the imported project for forbidden proof placeholders, duplicate names and tracking IDs, and missing local imports.'],['build','Lean build','Builds the MatingOfTrees target and its dependencies, reusing valid incremental outputs.'],['axioms','Axiom audit','Inspects the transitive axiom dependencies of the configured declarations. Missing audit records are not a pass.']].map(([key,title,desc])=>`<article class="card">${badge(c[key]||'not_recorded')}<h3>${title}</h3><p class="muted">${desc}</p></article>`).join('');
 const phaseNames={checkout:'Checkout',cache_attach:'Attach cache',toolchain:'Toolchain',dependency_cache:'Dependency cache',source_checks:'Source checks',compilation:'Lean build',axiom_audit:'Axiom audit'};
 const max=Math.max(1,...Object.keys(phaseNames).map(k=>t[k]||0));
 const timings=Object.entries(phaseNames).filter(([k])=>typeof t[k]==='number').map(([k,v])=>`<div class="timing"><span>${v}</span><div class="track"><div class="bar" style="width:${Math.max(0,Math.min(100,t[k]/max*100))}%"></div></div><span>${duration(t[k])}</span></div>`).join('');
 const sourceRows=[['files','Lean files counted'],['closure','Files in checked import closure'],['orphans','Orphan files (informational)'],['untracked','Untracked files'],['forbidden','Forbidden occurrences'],['duplicate_names','Duplicate names'],['duplicate_ids','Duplicate tracking IDs'],['blocking','Blocking issues']].filter(([k])=>s[k]!==undefined).map(([k,v])=>row(v,s[k])).join('');
 const cache=r.rebuilt_jobs===0?'Fully cached':typeof r.rebuilt_jobs==='number'?`${r.rebuilt_jobs} rebuilt jobs`:'Not recorded';
 root.innerHTML=`<section class="hero"><div class="tag">${esc(r.context)} · ${esc(r.source)}</div><h1>${titles[r.status]}</h1><p class="muted">${intro[r.status]}</p><div class="mono">${esc(r.sha)}</div><div class="facts"><div><span>Total run time</span><strong>${duration(t.total)}</strong></div><div><span>Incremental build</span><strong>${esc(cache)}</strong></div><div><span>Lean version</span><strong>${esc(r.lean_version||'Not recorded')}</strong></div><div><span>Finished · your local time</span><strong>${esc(date(r.finished))}</strong></div></div><div class="linkrow"><a href="${SOURCE+r.sha}">View commit on GitHub ↗</a><a href="${esc(jsonUrl)}">Download report JSON ↗</a></div></section><section class="grid" aria-label="Check results">${cards}</section><div class="columns"><section class="panel"><h2>Where the time went</h2>${timings||'<p class="muted">No phase timings were recorded for this run.</p>'}<p class="muted">Times describe this run. Queue time is excluded. Cached build jobs need no recompilation.</p>${r.build_jobs!==undefined?`<p><strong>${esc(r.build_jobs.toLocaleString())}</strong> build jobs in the completed target. This is not a theorem count.</p>`:''}</section><section class="panel"><h2>Source coverage</h2>${sourceRows?`<table><tbody>${sourceRows}</tbody></table>`:'<p class="muted">Source counts were not recorded for this run.</p>'}</section></div><section class="panel"><h2>What the axiom audit established</h2>${a?`<p><strong>${esc(a.declarations_reported)}</strong> declarations produced axiom reports. ${c.axioms==='passed'?'The configured audit passed.':'Use the check result above for the audit verdict.'}</p><p>Allowed foundations: <span class="mono">${esc(a.allowed_foundations.join(', '))}</span>.</p><p class="muted">These are standard foundations of classical Lean mathematics. The audit follows dependencies through intermediate lemmas.</p>`:'<p class="muted">No standalone axiom audit details were recorded for this run. An older build-only result does not certify the newer axiom audit.</p>'}<details><summary>Understand the foundations</summary><ul><li><strong>propext:</strong> logically equivalent propositions can be treated as equal.</li><li><strong>Classical.choice:</strong> choose an element of an inhabited type without a computational selection rule.</li><li><strong>Quot.sound:</strong> equivalent representatives are equal in their quotient.</li></ul></details></section><section class="panel"><h2>How to read this result</h2><p>The build checks the <span class="mono">MatingOfTrees</span> import graph with the pinned Lean toolchain. Valid previously compiled artifacts are reused. The axiom audit covers its configured declarations and their dependencies.</p><p>Source-check orphans are informational, and <span class="mono">Scratch/</span> is excluded by the source checker. Unimported files are not automatically built. Warnings alone do not fail this check.</p><p>A formal proof establishes the statement written in Lean, including its hypotheses. This report does not certify that definitions and statements faithfully reproduce a paper, or that the entire mathematical project is complete.</p>${r.status==='failure'||r.status==='error'?'<p class="notice">Detailed compiler errors remain in the private build logs. This public report identifies failing stages without exposing source excerpts or machine paths.</p>':''}</section>`;
}
async function start(){
 const p=new URLSearchParams(location.search),sha=p.get('sha'),rev=p.get('revision');
 if(sha){if(!shaPattern.test(sha)||!shaPattern.test(rev||''))throw new Error('Open the full Details link from GitHub; a commit and report revision are required.');const url=`${DATA}${rev}/reports/${sha}.json`;const r=await load(url);if(r.sha!==sha)throw new Error('Report commit mismatch.');render(r,url);return;}
 const all=await load(`${DATA}reports/index.json?refresh=${Math.floor(Date.now()/15000)}`);
 root.innerHTML=`<section class="hero"><div class="tag">Continuous integration</div><h1>Every result, explained.</h1><p class="muted">Builds, source checks, and axiom audits. Open a completed run to inspect its coverage and timings.</p></section><section class="panel"><h2>Recent completed results</h2><table class="recent"><thead><tr><th>Commit</th><th>Source</th><th>Finished</th><th>Result</th></tr></thead><tbody>${all.filter(x=>shaPattern.test(x.sha)&&shaPattern.test(x.revision)).map(x=>`<tr><td><a href="?sha=${x.sha}&amp;revision=${x.revision}">${x.sha.slice(0,10)}</a></td><td>${esc(x.source)}</td><td>${esc(date(x.finished))}</td><td>${badge(x.status)}</td></tr>`).join('')}</tbody></table><p class="muted">Only completed or retired runs appear here. GitHub shows pending and running status.</p></section>`;
}
start().catch(e=>{root.innerHTML='<h1>Report unavailable</h1><p id="error"></p><p><a href="">Try again</a> · <a href="./">All reports</a></p>';document.getElementById('error').textContent=e.message;});
</script>
</body>
</html>
